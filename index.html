<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 사운드랩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 왼쪽: 한 번에 한 가지 일. 오른쪽: 채워지는 내 노래. 검은 상자 = AI에 붙여넣을 말 */
:root{
  --bg:#F2F4F8; --paper:#FFFFFF; --ink:#12151C; --ink2:#4B5364; --ink3:#7A8394;
  --line:#DCE1EA; --accent:#2B50F0; --accent-soft:#E7ECFF; --mark:#FFE14A; --ok:#0B8A5F; --warn:#C2410C;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"D2Coding",Consolas,"Malgun Gothic",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 var(--font);word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.03em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.spacer{flex:1}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:14px;font-weight:650;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.ghost:hover{border-color:var(--ink)}

.rail{max-width:1240px;margin:0 auto;padding:16px 20px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{font-size:12.5px;font-weight:800;color:var(--ink3);margin:0 2px 0 10px;letter-spacing:.02em}
.grp:first-child{margin-left:0}
.rs{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 14px 6px 6px;border-radius:999px;font-size:16px;font-weight:650;color:var(--ink3)}
.rs .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink2);font-weight:800;font-size:15px}
.rs.done .n{background:var(--ok);color:#fff}
.rs.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(18,21,28,.12)}
.rs.on .n{background:var(--accent);color:#fff}

.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}
.card{background:var(--paper);border-radius:22px;padding:34px 38px 40px;min-width:0}
h1{font-size:clamp(28px,3.4vw,38px);line-height:1.25;letter-spacing:-.03em;font-weight:800;margin:0 0 26px;text-wrap:balance}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:38px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1+h2,.recs h2{margin-top:0}
h2 small{font-size:15px;font-weight:500;color:var(--ink3)}
.gh{font-size:14px;font-weight:800;color:var(--ink3);margin:16px 0 8px}
.gh:first-child{margin-top:0}

input[type=text],input[type=password],textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--paper);line-height:1.6}
textarea{resize:vertical}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent);outline:0}
::placeholder{color:#A4ACBA}

/* 고르는 카드 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.chips.s{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
.chip{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;line-height:1.35;min-height:56px}
.chip b{display:block;font-weight:750}
.chip span{display:block;font-size:14px;color:var(--ink3);margin-top:3px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed=true] span{color:#D5DDFF}
.chip .num{float:right;width:22px;height:22px;margin-left:6px;border-radius:50%;background:#fff;color:var(--accent);font:800 13px/22px var(--font);text-align:center;font-style:normal}
.sw{display:flex;gap:4px;margin-bottom:8px}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.recs{background:var(--accent-soft);border-radius:18px;padding:20px 22px 22px}
.recs .chip{border-color:transparent}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.idea{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-size:16px;font-weight:600}
.idea:hover{border-color:var(--ink)}
.idea[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 가사 줄 */
.sec{border:2px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-top:16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-h b{font-size:19px;font-weight:800}
.sec-h span{font-size:14.5px;color:var(--ink3)}
.badge{font-size:12.5px;font-weight:800;background:var(--mark);border-radius:6px;padding:2px 8px;color:var(--ink)!important}
.ln{margin-top:12px}
.ln label{display:block;font-size:15px;font-weight:650;color:var(--ink2);margin-bottom:4px}
.ln-r{display:flex;gap:8px;align-items:center}
.ln-r input{flex:1;min-width:0;background:#FFFBE0;border-color:#F1DC6B}
.ln-r input:focus{border-color:var(--ink)}
.cnt{flex:none;width:62px;text-align:right;font-size:13.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cnt .w{color:var(--warn);font-weight:750}
.exb{flex:none;border:0;background:var(--accent-soft);color:#1B3AC4;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.exb:hover{background:#D5DDFF}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.tog{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:650}
.tog:hover{border-color:var(--ink)}
.tog[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.bank{background:var(--bg);border-radius:18px;padding:18px 20px;margin-top:16px}
.bank h2{margin-top:0}
.bank-t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{border:0;background:var(--paper);border-radius:999px;padding:5px 13px;font-size:15.5px;font-weight:600;box-shadow:0 1px 2px rgba(18,21,28,.1)}
.word:hover{background:var(--mark)}
.words h4{flex-basis:100%;margin:8px 0 0;font-size:14px;color:var(--ink3)}
.words h4:first-child{margin-top:0}

/* 검은 상자 */
.pbox{background:var(--ink);color:#F1F3F8;border-radius:16px;padding:14px 16px 16px;margin-top:12px}
.pbox-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ptag{font:700 13px/1 var(--mono);letter-spacing:.05em;background:var(--mark);color:var(--ink);padding:6px 9px;border-radius:6px}
.pto{font-size:14px;color:#A9B2C5}
.copy{margin-left:auto;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:6px 18px;font-size:15px;font-weight:750}
.copy:hover{background:var(--mark)}
.pbox pre{margin:0;font:15.5px/1.65 var(--mono);white-space:pre-wrap;max-height:280px;overflow:auto}
.pbox textarea{background:#1D212C;border-color:#343B4C;color:#fff;font:15.5px/1.65 var(--mono);min-height:260px}
.means{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mean{background:var(--bg);border-radius:10px;padding:6px 12px;font-size:14px;line-height:1.35}
.mean b{display:block;font:700 14px var(--mono)}
.mean.new{background:var(--mark)}
.long{flex-basis:100%;font-size:14.5px;color:var(--warn);font-weight:650}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:750;background:var(--ink);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{background:#2A3040}
.btn.line{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn.line:hover{background:var(--bg)}
.hint{font-size:15px;color:var(--ink2);margin:8px 0 0}
.fixes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.scene{border:2px solid var(--line);border-radius:18px;padding:16px 20px 20px;margin-top:14px}
.scene-l{font-weight:800;font-size:19px;margin-bottom:8px}
.scene-l small{display:block;font-size:13px;font-weight:700;color:var(--accent)}
.lines{display:grid;gap:6px}
.lpick{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600}
.lpick[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* 내 노래 */
.sheet{position:sticky;top:72px;background:var(--ink);color:#fff;border-radius:22px;padding:24px;font-size:15.5px;line-height:1.6;max-height:calc(100vh - 160px);overflow:auto}
.sheet .lbl{font:700 11.5px/1 var(--mono);letter-spacing:.1em;color:#8D97AB;margin:20px 0 8px}
.sheet .lbl:first-child{margin-top:0}
.sheet .ttl{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sheet .empty{color:#6C7689}
.sheet .part{font-size:12.5px;font-weight:800;color:var(--mark);margin:12px 0 2px}
.sheet .part:first-child{margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#262B38;border-radius:999px;padding:3px 11px;font-size:14px}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(242,244,248,.95);border-top:1px solid var(--line);z-index:15}
.nav-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.nav .next{flex:1;color:var(--ink2);font-size:15px;text-align:right;min-width:0}
.x{border:0;background:none;color:var(--ink3);font-size:14px;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-weight:650;font-size:16px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
/* 선생님께 보내기 · 선생님 화면 */
.send{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.send input{flex:1;min-width:180px;max-width:320px}
.sent{color:var(--ok);font-weight:700}
.demo{background:var(--mark);border-radius:12px;padding:8px 14px;font-size:14.5px;font-weight:650;margin:0 0 18px}
.tw{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.tw h1 small{font-size:17px;font-weight:600;color:var(--ink3);letter-spacing:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px;align-items:start}
.tc{background:var(--paper);border-radius:18px;padding:20px 22px}
.tc.done{opacity:.5}
.tc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tc-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tc-h span{font-size:14px;color:var(--ink3)}
.tf{margin-top:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
.tf-h{display:flex;align-items:center;gap:8px}
.tf-h .copy{background:var(--ink);color:#fff;padding:5px 16px}
.tf-h .copy:hover{color:var(--ink)}
.tsec{font-size:14px;font-weight:800;color:var(--accent);margin:18px 0 -4px}
.tback{margin-top:12px;border:2px dashed var(--line);border-radius:12px;padding:10px 12px 12px}
.tback label{display:block;font-size:13.5px;color:var(--ink2);font-weight:600}
.tl{margin-top:8px;font-size:15px;padding:8px 12px!important}
.got{margin-top:16px;background:var(--accent-soft);border-radius:16px;padding:16px 20px 18px}
.got b{font-size:19px;font-weight:800;margin-right:10px}
.got span{font-size:15px;color:var(--ink2)}
.tf pre{margin:8px 0 0;font:14.5px/1.6 var(--mono);white-space:pre-wrap;max-height:132px;overflow:auto}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.sheet{position:static;max-height:none}.card{padding:24px 18px 30px}}
@media (max-width:560px){.top-in,.rail,.wrap,.nav-in{padding-left:16px;padding-right:16px}.rs .t{display:none}.rs.on .t{display:inline}.grp{display:none}.cnt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

 {id:'school',n:['학교','학교생활'],d:['급식, 쉬는 시간, 체육, 우리 반','교실, 시험, 체육대회, 졸업'],rec:['band','cheer','camp'],

  ex:[{v1:['저녁이 되면 우리 집 부엌','보글보글 찌개 끓는 소리','엄마 옆에서 수저를 놓아','배보다 마음이 먼저 불러'],ch:['말 안 해도 알고 있어요','오늘은 내가 먼저 말할게요','고마워요 사랑해요','조금 쑥스럽지만'],v2:['늦게 온 아빠의 무거운 어깨','토닥토닥 작은 손으로','피곤한 얼굴에 웃음이 번져','우리 집 불빛이 제일 따뜻해']},

const KEY='soundlab-v4';
const blank=()=>({level:'e',step:0,topic:'',about:'',L:{v1:['','','',''],pre:['',''],ch:['','','',''],v2:['','','',''],br:['','']},rep:false,chant:'',custom:null,title:'',
 preset:'',allPre:false,genres:[],moods:[],tempo:'',key:'',who:'',how:'',inst:[],instMine:false,tex:[],flow:'',more:'',fix:[],prev:null,picks:[],hero:'',look:'',color:'',cam:'',trans:'',bank:0,nick:'',sid:'',sent:0,isent:0,final:'',why:'',best:'',feel:''});

function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k]}return a}

const put=(p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>o[k],S)[l]=v};

 const C=[...ch,...(S.rep&&ch[0]?[ch[0]]:[]),...(S.chant?[`${S.chant} ${S.chant}`]:[])],o=[],N=k=>SEC[lv()][k][0],

 S.moods.forEach(m=>{const x=by(MOOD,m);x&&t.push([x[2],x[1]])});
 const P=by(TEMPO,S.tempo);if(P)t.push([lv()>1?`${P[2]}, ${P[3]} BPM`:P[2],lv()>1?`${P[1]} (1분에 ${P[3]}박)`:P[1]]);

 if(lv())S.tex.forEach(i=>{const x=by(TEX,i);x&&t.push([x[2],x[1]])});

 S.fix.forEach(f=>{const x=by(FIX,f);x&&x[2]&&t.push([x[2],x[3]])});
 if(lv()&&S.more.trim())t.push([S.more.trim(),'내가 덧붙인 말']);
 return t}
const style=()=>tags().map(t=>t[0]).join(', ');
function imgPrompt(i){const p=S.picks[i],L=by(LOOK,S.look),C=by(COLOR,S.color),moods=S.moods.map(m=>by(MOOD,m)?.[1]).filter(Boolean);

- 장면: ${p.more.trim()||p.line}
- 이 장면의 가사: "${p.line}"${S.hero.trim()?`\n- 주인공: ${S.hero.trim()}`:''}${L?`\n- 그림 스타일: ${L[1]}`:''}${C?`\n- 색: ${C[1]}`:''}${moods.length?`\n- 기분: ${moods.join(', ')}`:''}

function mvPrompt(){const en=[by(LOOK,S.look)?.[2],by(COLOR,S.color)&&by(COLOR,S.color)[2]+' palette',...S.moods.map(m=>by(MOOD,m)?.[2]),by(CAM,S.cam)?.[2],by(TRANS,S.trans)?.[2]].filter(Boolean).join(', ');
 const sc=S.picks.map((p,i)=>`${i+1}. ${p.more.trim()||p.line}`).join('\n');
 return `${en}${S.hero.trim()?`\n주인공: ${S.hero.trim()}`:''}${sc?`\n\n장면 순서\n${sc}`:''}`.trim()}

const SEND_URL='https://script.google.com/macros/s/AKfycbyr8A8vj9-94zl-kHaocsY-fANC8J4qR_UjJX6aZWKXwUsd0ogJo6FioMr6Ep_R7Odq-A/exec',BOX='soundlab-inbox',TEACH=()=>location.hash==='#teacher';

const boxGet=()=>{try{return JSON.parse(localStorage.getItem(BOX)||'[]')}catch(e){return[]}};
async function api(body){
 if(!SEND_URL){let a=boxGet();
  if(body.op==='put'){const x=a.find(i=>i.id===body.id);x?Object.assign(x,body.f):a.push({id:body.id,...body.f})}
  if(body.op==='del')a=a.filter(x=>x.id!==body.id);
  if(body.op==='clear')a=[];
  localStorage.setItem(BOX,JSON.stringify(a));return{ok:true}}
 return(await fetch(SEND_URL,{method:'POST',body:JSON.stringify(TEACH()?{...body,key:tkey}:body)})).json()}
async function inbox(){const was=JSON.stringify(INBOX)+tmsg;
 if(!SEND_URL){INBOX=boxGet();tmsg=''}
 else if(!tkey){INBOX=[];tmsg='선생님 암호를 넣고 확인을 눌러 주세요.'}
 else try{const r=await api({op:'list'});if(r.ok){INBOX=r.items;tmsg=''}else{INBOX=[];tmsg='암호가 맞지 않아요.'}}catch(e){tmsg='목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}
 if(TEACH()&&was!==JSON.stringify(INBOX)+tmsg)render(1)}

 m=m||null;const old=MINE,was=JSON.stringify(old);MINE=m;if(was===JSON.stringify(m))return;

function teacher(){const L=[...INBOX].sort((a,b)=>(!todo(a)-!todo(b))||(a.at-b.at)),left=L.filter(todo).length;

 <div class="tw">${SEND_URL?`<div class="send" style="margin-bottom:18px"><input type="password" id="tkey" value="${esc(tkey)}" placeholder="선생님 암호" autocomplete="off"><button class="btn" data-act="trefresh">확인</button></div>`:'<p class="demo">미리보기예요. 지금은 이 컴퓨터에서 보낸 주문만 보여요.</p>'}

 ${x.imgs?.length?`<div class="tsec">그림 · Gemini</div>${x.imgs.map((p,i)=>f(x,'p'+i,'그림 '+(i+1))).join('')}

 <div class="row"><button class="x" data-act="tdel" data-id="${x.id}">지우기</button></div></section>`).join('')}</div>`:tmsg?'':'<p class="hint">아직 받은 주문이 없어요. 학생이 보내면 여기에 나타나요.</p>'}</div>`}

const TEXT={talk,in:a=>{const [id,k]=a.split('.'),x=INBOX.find(i=>i.id===id);return(/^p\d$/.test(k)?x?.imgs?.[+k[1]]:x?.[k])||''},title:()=>titleNow()||'(제목을 정하면 여기에 나와요)',lyrics:()=>lyrics()||'(가사를 쓰면 여기에 나와요)',style:()=>style()||'(소리를 고르면 여기에 나와요)',img:i=>imgPrompt(+i),mv:()=>mvPrompt()||'(고르면 여기에 나와요)'};

 <h2>${T('만들어 보니 어땠어?','만들어 보니 어땠어?','만들어 본 소감')}</h2><input type="text" data-k="feel" value="${esc(S.feel)}" placeholder="예) 내 이야기가 노래가 돼서 신기했어">
 <h2>발표 카드 <small>${T('이걸 보면서 말하면 돼','이걸 보면서 말하면 돼','이 내용을 보며 발표해요')}</small></h2>
 ${pbox('발표','','talk')}
 <div data-live="gotimg">${gotimg()}</div>`}
];
const DONE=[()=>S.topic||S.about,()=>lines('v1').length&&lines('ch').length,()=>S.genres.length&&S.moods.length&&S.tempo,()=>S.title,()=>S.picks.length&&S.look,()=>S.final&&S.best];

function sheet(){const P=S.custom!=null?null:parts(),t=tags();
 return `<div class="lbl">내 노래</div><div class="ttl ${titleNow()?'':'empty'}">${esc(titleNow())||'제목은 아직'}</div>${S.about?`<div style="color:#A9B2C5">${esc(S.about)}</div>`:''}
 <div class="lbl">가사</div>${P?(P.length?P.map(p=>`<div class="part">${p[1]}</div>${p[2].map(esc).join('<br>')}`).join(''):'<div class="empty">한 줄씩 쓰면 여기에 노래 모양으로 쌓여요</div>'):`<div style="white-space:pre-wrap">${esc(S.custom)}</div>`}
 <div class="lbl">소리</div>${t.length?`<div class="tags">${t.map(x=>`<span>${esc(x[1])}</span>`).join('')}</div>`:'<div class="empty">고른 소리가 여기에</div>'}`}
const LIVE={sheet,means,cnt,got,gotimg};
function live(){document.querySelectorAll('[data-live]').forEach(el=>{const [n,a]=el.dataset.live.split(':');el.innerHTML=LIVE[n]?LIVE[n](a):esc(TEXT[n](a))})}

const app=document.getElementById('app');
function render(keep){
 if(TEACH()){app.innerHTML=teacher();if(!keep)window.scrollTo(0,0);return}
 const G=[['1차시',0,3],['2차시',3,5],['3차시',5,6]];if(S.step>=3&&!MINE)mine();
 app.innerHTML=`<header class="top"><div class="top-in"><div class="brand">AI 사운드<i>랩</i></div><span class="spacer"></span>
 <div class="seg" aria-label="학교급">${[['e','초등'],['m','중등'],['h','고등']].map(l=>`<button data-level="${l[0]}" aria-pressed="${S.level===l[0]}">${l[1]}</button>`).join('')}</div>
 <button class="ghost" data-act="save">저장</button><button class="ghost" data-act="load">불러오기</button><button class="ghost" data-act="tgo">선생님</button></div></header>
 <nav class="rail">${G.map(x=>`<span class="grp">${x[0]}</span>`+STEPS.slice(x[1],x[2]).map((t,j)=>{const i=x[1]+j;return `<button class="rs ${S.step===i?'on':''} ${DONE[i]()?'done':''}" data-step="${i}"><span class="n">${i+1}</span><span class="t">${t}</span></button>`}).join('')).join('')}</nav>
 <div class="wrap"><main class="card">${VIEW[S.step]()}</main><aside class="sheet" data-live="sheet" aria-label="내 노래">${sheet()}</aside></div>
 <div class="nav"><div class="nav-in"><button class="btn line" data-act="prev" ${S.step?'':'disabled style="opacity:.3"'}>이전</button>${S.step?'':'<button class="x" data-act="reset">처음부터 새로 하기</button>'}<span class="next">${S.step<5?'다음: '+STEPS[S.step+1]:'다 만들었어요!'}</span>${S.step<5?'<button class="btn" data-act="next">다음</button>':''}</div></div>`;
 if(!keep)window.scrollTo(0,0)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function go(i){S.step=Math.max(0,Math.min(5,i));store();render()}
const rand=a=>a[Math.floor(Math.random()*a.length)];
function applyPre(p){const lim=id=>by(TEMPO,id)[4]<=lv()?id:{vslow:'slow',vfast:'fast'}[id];
 Object.assign(S,{preset:p.id,genres:[...p.g],moods:[...p.m],tempo:lim(p.t),key:p.k,who:p.w,how:p.h,inst:[...p.i],instMine:true,tex:[...p.x],flow:p.f});
 beat(by(TEMPO,S.tempo)[3])}

/* ───────── 박자 들려주기 ───────── */
let AC,master,noise;
function beat(bpm){try{
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 if(master){master.gain.setValueAtTime(0,AC.currentTime);master.disconnect()}
 if(!noise){noise=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
 const b=60/bpm,t0=AC.currentTime+.06;
 for(let i=0;i<8;i++){const t=t0+i*b,o=AC.createGain();o.connect(master);
  if(i%2===0){const s=AC.createOscillator();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.12);o.gain.setValueAtTime(.9,t);o.gain.exponentialRampToValueAtTime(.001,t+.2);s.connect(o);s.start(t);s.stop(t+.22)}
  else{const s=AC.createBufferSource();s.buffer=noise;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800;o.gain.setValueAtTime(.45,t);o.gain.exponentialRampToValueAtTime(.001,t+.13);s.connect(f);f.connect(o);s.start(t);s.stop(t+.15)}}
 }catch(e){}}

/* ───────── 이벤트 ───────── */
const SOUND=['genres','moods','tempo','key','who','how','inst','tex','flow'];
let lastLine=null;
document.addEventListener('focusin',e=>{if(e.target.dataset?.k?.startsWith('L.'))lastLine=e.target.dataset.k});
// 선생님이 링크를 붙여넣으면 바로 저장. 칸에서 나오면 카드 순서를 다시 정리
document.addEventListener('input',e=>{const tl=e.target.dataset?.tl;if(!tl)return;const [id,k]=tl.split('.'),v=e.target.value.trim(),x=INBOX.find(i=>i.id===id);if(!x)return;
 const f={[k]:v};if(safe(v))f[k==='imgLink'?'imgRe':'re']=false;Object.assign(x,f);api({op:'put',id,f})});
document.addEventListener('change',e=>{if(e.target.dataset?.tl)setTimeout(()=>{if(TEACH()&&!document.activeElement?.dataset?.tl)render(1)},0)});
document.addEventListener('input',e=>{if(e.target.dataset?.tl)return;if(e.target.id==='tkey'){tkey=e.target.value;try{sessionStorage.setItem('soundlab-tkey',tkey)}catch(x){}return}
 const k=e.target.dataset?.k;if(!k)return;put(k,e.target.value);store();live();
 if(k==='about')document.querySelectorAll('.idea').forEach(b=>b.setAttribute('aria-pressed',b.dataset.idea===S.about))});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.step!=null)return go(+d.step);
 if(d.level){S.level=d.level;if(BANK[S.bank][2]>lv())S.bank=0;store();return render(1)}
 if(d.pick){const cur=g(d.pick),v=d.v;
  if(Array.isArray(cur)){const i=cur.indexOf(v),max=+d.max||99;if(i>=0)cur.splice(i,1);else if(cur.length>=max)return toast(`${max}개까지 고를 수 있어요. 하나를 먼저 빼 주세요.`);else cur.push(v);if(d.pick==='inst')S.instMine=true}
  else put(d.pick,cur===v?'':v);
  if(SOUND.includes(d.pick))S.preset='';
  if(d.pick==='genres'&&S.genres.length){const G=by(GENRE,S.genres[0]);if(!S.tempo)S.tempo=by(TEMPO,G[4])[4]<=lv()?G[4]:'fast';if(!S.instMine)S.inst=[...G[5]].slice(0,MAX().inst);if(!S.who&&S.genres.some(x=>x==='hiphop'||x==='trap'))S.who='rap'}
  if(d.pick==='tempo'&&S.tempo)beat(by(TEMPO,S.tempo)[3]);
  if(d.pick==='final'&&S.sid)api({op:'put',id:S.sid,f:{final:S.final}}).catch(()=>{});
  store();return render(1)}
 if(d.pre){applyPre(PRE.find(p=>p.id===d.pre));store();render(1);return toast('아래가 채워졌어요. 마음대로 바꿔 보세요.')}
 if(d.idea){S.about=S.about===d.idea?'':d.idea;store();return render(1)}
 if(d.ex){const [k,i]=d.ex.split('.'),ex=exOf(k,+i);if(S.L[k][i].trim()&&S.L[k][i]!==ex)return toast('이미 쓴 줄이 있어요. 지우고 누르면 예시가 들어가요.');S.L[k][i]=ex;store();render(1);toast('예시를 넣었어요. 내 이야기로 고쳐 보세요.');return}
 if(d.word){if(!lastLine||!document.querySelector(`[data-k="${lastLine}"]`))return toast('먼저 넣고 싶은 줄을 눌러 주세요.');const el=document.querySelector(`[data-k="${lastLine}"]`),p=el.selectionStart??el.value.length,w=(p&&el.value[p-1]!==' '?' ':'')+d.word+(el.value[p]&&el.value[p]!==' '?' ':'');el.value=el.value.slice(0,p)+w+el.value.slice(p);put(lastLine,el.value);store();live();el.focus();el.setSelectionRange(p+w.length,p+w.length);return}
 if(d.best){S.best=S.best===d.best?'':d.best;store();return render(1)}
 if(d.bank){S.bank=+d.bank;store();return render(1)}
 if(d.chant){S.chant=S.chant===d.chant?'':d.chant;store();return render(1)}
 if(d.line){const i=S.picks.findIndex(p=>p.line===d.line);if(i>=0)S.picks.splice(i,1);else if(S.picks.length>=3)return toast('3줄까지 고를 수 있어요. 하나를 먼저 빼 주세요.');else S.picks.push({line:d.line,more:''});store();return render(1)}
 if(d.fix){const before=tags().map(x=>x[0]),f=d.fix;
  if(f==='fast'||f==='slow'){const L=tempos(),i=L.findIndex(x=>x[0]===S.tempo),n=i+(f==='fast'?-1:1);if(i<0)return toast('소리에서 빠르기를 먼저 골라 주세요.');if(n<0||n>=L.length)return toast(f==='fast'?'이미 가장 느린 빠르기예요.':'이미 가장 빠른 빠르기예요.');S.tempo=L[n][0];toast(`빠르기를 '${L[n][1]}'로 바꿨어요.`)}
  else{const i=S.fix.indexOf(f);if(i>=0)S.fix.splice(i,1);else{S.fix.push(f);if(OPP[f])S.fix=S.fix.filter(x=>x!==OPP[f]);toast('소리 주문에 넣었어요.')}}
  S.prev=before;store();return render(1)}
 if(d.copy){const [n,a]=d.copy.split(':'),txt=TEXT[n](a),ok=()=>{t.textContent='복사했어요';setTimeout(()=>t.textContent='복사',1400)};
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(x){toast('복사가 안 돼요. 글을 드래그해서 복사해 주세요.')}ta.remove()});return}
 switch(d.act){
  case'next':return go(S.step+1);
  case'prev':return go(S.step-1);
  case'rep':S.rep=!S.rep;store();return render(1);
  case'uncustom':S.custom=null;store();return render(1);
  case'allpre':S.allPre=!S.allPre;store();return render(1);
  case'dice':{const p=rand(PRE.filter(x=>x.tier<=lv()&&x.id!==S.preset));applyPre(p);store();render(1);return toast(`'${p.n}' 조합이 나왔어요.`)}
  case'lucky':{const tp=rand(TOPIC.filter(x=>x.id!==S.topic));S.topic=tp.id;S.about=rand(tp.ideas[tg()]);store();render(1);return toast(`'${tp.n[tg()]}'이(가) 나왔어요. 마음에 안 들면 또 눌러요.`)}
  case'save':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`사운드랩_${(titleNow()||'내노래').replace(/[\\/:*?"<>|]/g,'')}.json`;document.body.appendChild(a);a.click();a.remove();return toast('다운로드 폴더에 저장했어요.')}
  case'load':return document.getElementById('file').click();
  case'send':{const nick=S.nick.trim();
   if(!nick)return toast('별명을 먼저 적어 주세요.');
   if(!lyrics().trim()||!style())return toast('가사와 소리를 먼저 만들어 주세요.');
   S.sid=S.sid||Math.random().toString(36).slice(2,10);t.disabled=true;
   api({op:'put',id:S.sid,f:{nick,title:titleNow(),lyrics:lyrics(),style:style(),level:S.level,at:Date.now(),re:!!S.sent}})
    .then(r=>{if(!r.ok)throw 0;S.sent=Date.now();store();render(1);mine();toast('선생님께 보냈어요!')})
    .catch(()=>{t.disabled=false;toast('보내지 못했어요. 선생님께 말해 주세요.')});return}
  case'sendimg':{const nick=S.nick.trim(),n=Math.min(3,S.picks.length);
   if(!nick)return toast('별명을 먼저 적어 주세요.');
   if(!n)return toast('그림으로 만들 가사를 먼저 골라 주세요.');
   S.sid=S.sid||Math.random().toString(36).slice(2,10);t.disabled=true;
   api({op:'put',id:S.sid,f:{nick,title:titleNow(),level:S.level,at:Date.now(),imgs:Array.from({length:n},(_,i)=>imgPrompt(i)),imgRe:!!S.isent}})
    .then(r=>{if(!r.ok)throw 0;S.isent=Date.now();store();render(1);mine();toast('선생님께 보냈어요!')})
    .catch(()=>{t.disabled=false;toast('보내지 못했어요. 선생님께 말해 주세요.')});return}
  case'tgo':location.hash='#teacher';return;
  case'tback':location.hash='';return;
  case'trefresh':return inbox().then(()=>toast('새로 불러왔어요.'));
  case'tdel':if(confirm('이 주문을 지울까요?'))api({op:'del',id:d.id}).then(inbox);return;
  case'tclear':if(confirm('받은 주문을 모두 지울까요? 되돌릴 수 없어요.'))api({op:'clear'}).then(inbox);return;
  case'reset':if(confirm('지금까지 만든 것이 모두 지워져요. 새로 시작할까요?')){const l=S.level;S=blank();S.level=l;store();render()}return;
 }});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=merge(blank(),JSON.parse(r.result));store();render();toast('불러왔어요.')}catch(x){toast('사운드랩 저장 파일이 아니에요.')}};r.readAsText(f);e.target.value=''});
render();
addEventListener('hashchange',()=>{render();TEACH()?inbox():mine()});
addEventListener('storage',e=>{if(e.key!==BOX)return;const a=document.activeElement;TEACH()?(a?.tagName!=='INPUT'&&inbox()):mine()});
setInterval(()=>{if(TEACH()&&document.activeElement?.tagName!=='INPUT')inbox()},8000);
setInterval(()=>{if(S.step>=3&&!document.hidden)mine()},15000);
TEACH()?inbox():mine();
})();
</script>
</body>
